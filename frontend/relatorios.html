<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Smart Stock — Relatórios e Listagem</title>
  <link rel="stylesheet" href="estilo.css">
  <style>
    .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; }
    .grid-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .card-prod { background: var(--card); border: 1px solid var(--border); padding: 1.5rem; border-radius: var(--radius); transition: border-color 0.2s; }
    .card-prod:hover { border-color: var(--border2); }
    .p-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .p-brand { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1rem; }
    .p-info-row { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 0.4rem 0; border-top: 1px dashed rgba(34,201,106,0.08); }
    .p-info-row:last-child { border-bottom: none; }
    .stock-tag { font-weight: 700; color: var(--green-l); }
    .stock-tag.low { color: var(--red); }

    @media print {
      aside, header, .actions-bar, .btn-deletar-container { display: none !important; }
      .app-container { grid-template-columns: 1fr; }
      main { padding: 0; background: #fff; color: #000; }
      .card-prod { border: 1px solid #000; background: #fff; color: #000; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside>
      <div class="brand">Smart Stock</div>
      <ul class="nav-list">
        <li><a href="dashboard.html" class="nav-item">📊 Dashboard</a></li>
        <li><a href="cadastro.html" class="nav-item">💊 Cadastrar Medicamento</a></li>
        <li><a href="movimentacoes.html" class="nav-item">📦 Histórico Movimentações</a></li>
        <li><a href="relatorios.html" class="nav-item active">📋 Relatórios / Listagem</a></li>
      </ul>
      <div style="padding:0 0.75rem;"><button class="nav-item" id="btn-logout" style="width:100%; color:var(--red); background:rgba(229,57,53,0.05); border:none;">🚪 Encerrar Sessão</button></div>
    </aside>

    <div class="main-wrapper">
      <header>
        <div>
          <button class="btn-act" id="btn-trigger-entrada">📥 Lançar Entrada</button>
          <button class="btn-act" id="btn-trigger-saida" style="background:var(--amber)">📤 Lançar Saída</button>
        </div>
        <div class="header-actions">
          <button class="noti-btn" id="btn-toggle-alerts">🔔 <span class="noti-badge">0</span></button>
          <div class="user-profile">
            <div class="avatar" id="user-av">??</div>
            <div class="user-info"><span class="u-name" id="user-name">...</span><span class="u-role" id="user-role">...</span></div>
          </div>
        </div>
      </header>

      <main>
        <h2 style="font-family:var(--serif); font-size:2rem; margin-bottom:0.5rem;">Relatórios de Inventário</h2>
        <p style="color:var(--muted)">Listagem completa de todos os fármacos e insumos ativos em sistema.</p>

        <div class="actions-bar">
          <span style="color: var(--muted);" id="total-medicamentos">A calcular itens...</span>
          <button class="btn-sec" id="btn-imprimir">🖨️ Imprimir Relatório Atual</button>
        </div>

        <div class="grid-produtos" id="inventario-grid">
          </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>
  <div class="modal-bg" id="modal-entrada"><div class="modal-card"><div class="modal-header"><div class="modal-title">Entrada</div><button data-close="modal-entrada">&times;</button></div><div class="modal-body"><div class="form-group g-full"><label>Produto *</label><select id="me-prod" class="form-control"></select></div><div class="form-group g-full"><label>Quantidade *</label><input type="number" id="me-qtd" class="form-control" value="0"></div><div class="form-group g-full"><label>Validade</label><input type="date" id="me-val" class="form-control"></div></div><div class="modal-footer"><button class="btn-act" id="btn-confirmar-entrada">Confirmar</button></div></div></div>
  <div class="modal-bg" id="modal-saida"><div class="modal-card"><div class="modal-header"><div class="modal-title">Saída</div><button data-close="modal-saida">&times;</button></div><div class="modal-body"><div class="form-group g-full"><label>Produto *</label><select id="ms-prod" class="form-control"></select></div><div class="form-group g-full"><label>Quantidade *</label><input type="number" id="ms-qtd" class="form-control" value="0"></div></div><div class="modal-footer"><button class="btn-act" id="btn-confirmar-saida">Confirmar</button></div></div></div>

  <script src="global.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById('btn-imprimir').addEventListener('click', () => window.print());

      carregarProdutos();
    });

    async function carregarProdutos() {
      const grid = document.getElementById('inventario-grid');
      const totalTxt = document.getElementById('total-medicamentos');

      try {
        const res = await fetch(`${API_URL}/produtos`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        const produtos = await res.json();

        if(!res.ok || produtos.length === 0) {
          grid.innerHTML = `<p style="grid-column: span 3; color: var(--muted); text-align: center; padding: 3rem;">Nenhum medicamento encontrado no inventário.</p>`;
          totalTxt.textContent = "0 itens listados";
          return;
        }

        totalTxt.textContent = `${produtos.length} medicamentos catalogados`;
        let cards = '';
        
        produtos.forEach(p => {
          const isLow = p.qtd_estoque <= 5;
          const produtoId = String(p.id || p._id || '').trim();

          cards += `
            <div class="card-prod">
              <div class="p-title">${p.nome}</div>
              <div class="p-brand">${p.marca}</div>
              <div class="p-info-row">
                <span>Unidade:</span>
                <span style="color: var(--muted);">${p.unidade_medida}</span>
              </div>
              <div class="p-info-row">
                <span>Preço Unitário:</span>
                <span>R$ ${p.preco_unitario.toFixed(2)}</span>
              </div>
              <div class="p-info-row" style="border-top: 1px solid rgba(34,201,106,0.15); margin-top: 0.5rem; padding-top: 0.5rem;">
                <span style="font-weight: 500;">Qtd em Stock:</span>
                <span class="stock-tag ${isLow ? 'low' : ''}">${p.qtd_estoque}</span>
              </div>
              
              <div class="btn-deletar-container" style="margin-top: 1rem; text-align: right;">
                <button data-id="${produtoId}" onclick="deletarProdutoDoSistema(this)" style="background: rgba(229,57,53,0.1); color: var(--red); border: 1px solid rgba(229,57,53,0.2); padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: background 0.2s;">
                  🗑️ Excluir
                </button>
              </div>
            </div>
          `;
        });
        grid.innerHTML = cards;
      } catch(e) {
        grid.innerHTML = `<p style="grid-column: span 3; color: var(--red); text-align: center; padding: 3rem;">Erro ao conectar com o servidor.</p>`;
      }
    }

    async function deletarProdutoDoSistema(botao) {
      const id = botao.getAttribute('data-id');

      if (!id || id === 'undefined' || id.includes('…')) {
        alert("Erro: O ID do medicamento está inválido ou foi cortado pelo navegador.");
        return;
      }

      if (!confirm("Tem a certeza que deseja eliminar este medicamento do sistema definitivamente?")) {
        return;
      }

      try {
        const res = await fetch(`${API_URL}/produtos/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });

        if (res.ok) {
          alert("Medicamento excluído com sucesso!");
          carregarProdutos(); 
        } else {
          const dados = await res.json();
          alert("Erro ao excluir: " + (dados.message || dados.error));
        }
      } catch (err) {
        console.error("Erro ao conectar:", err);
        alert("Erro ao conectar com o servidor.");
      }
    }
  </script>
</body>
</html>
