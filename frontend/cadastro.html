<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><title>Smart Stock — Cadastrar Medicamento</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <div class="app-container">
    <aside>
      <div class="brand">Smart Stock</div>
      <ul class="nav-list">
        <li><a href="dashboard.html" class="nav-item">📊 Dashboard</a></li>
        <li><a href="cadastro.html" class="nav-item active">💊 Cadastrar Medicamento</a></li>
        <li><a href="movimentacoes.html" class="nav-item">📦 Histórico Movimentações</a></li>
        <li><a href="relatorios.html" class="nav-item">📋 Relatórios / Listagem</a></li>
      </ul>
      <div style="padding:0 0.75rem;"><button class="nav-item" id="btn-logout" style="width:100%; color:var(--red); background:rgba(229,57,53,0.05); border:none;">🚪 Encerrar Sessão</button></div>
    </aside>

    <div class="main-wrapper">
      <header>
        <div>
          <button class="btn-act" id="btn-trigger-entrada">📥 Lançar Entrada</button>
          <button class="btn-act" id="btn-trigger-saida" style="background:var(--amber)">📤 Lançar Saída</button>
        </div>
        <div class="header-actions">
          <button class="noti-btn" id="btn-toggle-alerts">🔔 <span class="noti-badge">0</span></button>
          <div class="user-profile">
            <div class="avatar" id="user-av">??</div>
            <div class="user-info"><span class="u-name" id="user-name">...</span><span class="u-role" id="user-role">...</span></div>
          </div>
        </div>
      </header>

      <main>
        <h2 style="font-family:var(--serif); font-size:2rem; margin-bottom:1.5rem;">Cadastrar Novo Medicamento</h2>
        
        <div style="background:var(--card); padding:2rem; border-radius:var(--radius); display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div class="form-group g-full">
            <label>Nome do Medicamento *</label>
            <input type="text" id="prod-nome" class="form-control" placeholder="Dipirona Monohidratada 500mg">
          </div>
          <div class="form-group">
            <label>Marca/Laboratório *</label>
            <input type="text" id="prod-marca" class="form-control" placeholder="Medley, EMS...">
          </div>
          <div class="form-group">
            <label>Unidade de Medida *</label>
            <input type="text" id="prod-unidade" class="form-control" placeholder="Comprimido, Frasco, Caixa">
          </div>
          <div class="form-group">
            <label>Preço Unitário (R$) *</label>
            <input type="number" id="prod-preco" class="form-control" step="0.01" value="0.00">
          </div>
          <div class="form-group">
            <label>Quantidade Inicial em Estoque *</label>
            <input type="number" id="prod-qtd" class="form-control" value="0">
          </div>
          <div class="form-group g-full" style="text-align:right; margin-top:1rem;">
            <button class="btn-act" id="btn-salvar-produto">💾 Salvar no Banco de Dados</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>
  <div class="modal-bg" id="modal-entrada"><div class="modal-card"><div class="modal-header"><div class="modal-title">Entrada</div><button data-close="modal-entrada">&times;</button></div><div class="modal-body"><div class="form-group g-full"><label>Produto</label><select id="me-prod" class="form-control"></select></div><div class="form-group g-full"><label>Qtd</label><input type="number" id="me-qtd" class="form-control"></div></div><div class="modal-footer"><button class="btn-act" id="btn-confirmar-entrada">Confirmar</button></div></div></div>
  <div class="modal-bg" id="modal-saida"><div class="modal-card"><div class="modal-header"><div class="modal-title">Saída</div><button data-close="modal-saida">&times;</button></div><div class="modal-body"><div class="form-group g-full"><label>Produto</label><select id="ms-prod" class="form-control"></select></div><div class="form-group g-full"><label>Qtd</label><input type="number" id="ms-qtd" class="form-control"></div></div><div class="modal-footer"><button class="btn-act" id="btn-confirmar-saida">Confirmar</button></div></div></div>

  <script src="global.js"></script>
  <script>
    document.getElementById('btn-salvar-produto').addEventListener('click', async () => {
      const dados = {
        nome: document.getElementById('prod-nome').value.trim(),
        marca: document.getElementById('prod-marca').value.trim(),
        unidade_medida: document.getElementById('prod-unidade').value.trim(),
        preco_unitario: parseFloat(document.getElementById('prod-preco').value),
        qtd_estoque: parseFloat(document.getElementById('prod-qtd').value),
        quantidade: parseFloat(document.getElementById('prod-qtd').value), 
        categoria_ids: [],
        fornecedor_ids: []
      };

      if(!dados.nome || !dados.marca || !dados.unidade_medida) {
        toast("Preencha todos os campos obrigatórios!", "red");
        return;
      }

      try {
        const res = await fetch(`${API_URL}/produtos`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` },
          body: JSON.stringify(dados)
        });
        if(res.ok) {
          toast("Medicamento cadastrado com sucesso! 💊", "green");
          setTimeout(() => window.location.href = 'dashboard.html', 1500);
        } else {
          toast("Erro ao processar os dados.", "red");
        }
      } catch(e) { toast("Erro ao conectar ao servidor.", "red"); }
    });
  </script>
</body>
</html>
