<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><title>Smart Stock — Login</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="login-screen">
  <div class="login-box">
    <div class="login-logo">Smart Stock</div>
    <div id="login-err" class="login-error"></div>
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" id="inp-user" class="form-control" placeholder="admin">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="inp-pass" class="form-control" placeholder="••••••••">
    </div>
    <button class="btn-act" id="btn-entrar" style="width:100%; justify-content:center; padding:0.8rem;">Acessar Sistema</button>
  </div>

  <script>
    document.getElementById('btn-entrar').addEventListener('click', async () => {
      const u = document.getElementById('inp-user').value;
      const s = document.getElementById('inp-pass').value;
      const err = document.getElementById('login-err');
      err.style.display = 'none';

      try {
        const res = await fetch(`http://localhost:8890/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario: u, senha: s })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'dashboard.html';
        } else {
          err.textContent = data.mensagem; err.style.display = 'block';
        }
      } catch(e) { err.textContent = "Erro de conexão."; err.style.display = 'block'; }
    });
  </script>
</body>
</html>
